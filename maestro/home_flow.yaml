appId: com.plath.scancard
---
# Skill: .kiro/skills/android-cli/references/journeys.md + testing-setup Step 9/12
# Strategy: clearStateで毎回クリーン起動 / exact text優先 / idはcontentDescription依存のためtestTag移行提案をコメントで併記 / auto-launch対応
# ScanScreenは LaunchedEffect(hasCameraPermission) で自動起動 (alreadyAutoLaunched) するため extendedWaitUntil + optional で堅牢化

- clearState
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ScanCard"
    timeout: 8000
# F-2: Home FAB 1タップでScanScreenへ → Scanner自動起動 (ScanScreen.kt:81-108)
- tapOn:
    id: "Scan Document" # contentDescription of the FloatingActionButton
    # TODO(F-3 testTag): contentDescription依存は壊れやすい → Modifier.testTag("homeFabScan") 導入を推奨。移行後は tapOn: { id: "homeFabScan" } に置換
- extendedWaitUntil:
    visible: "Scan Document"
    timeout: 8000
# F-2 robust: 自動起動で GmsDocumentScanner UI がオーバーレイしても失敗しないよう assertVisible ではなく extendedWaitUntil を使用
# Fallback: 自動起動がスキップ/キャンセルされた場合は "Start Scanning" 手動ボタンが表示される → optional tap で吸収
- tapOn:
    text: "Start Scanning"
    optional: true
# Scanner外部UIが出た場合は back で閉じて元のScanScreenに戻る (GmsDocumentScanningはPlay Services activity)
- back:
    optional: true
- extendedWaitUntil:
    visible: "Scan Document"
    timeout: 3000
    optional: true
- back
- extendedWaitUntil:
    visible: "ScanCard"
    timeout: 5000
- tapOn: "Create Manual Deck"
- extendedWaitUntil:
    visible: "New Deck"
    timeout: 5000
- inputText: "Test Deck"
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Test Deck"
    timeout: 5000
- tapOn:
    id: "Delete" # contentDescription of the Delete icon
    # TODO(F-3 testTag): 削除アイコンは contentDescription依存 → testTag("deckDeleteBtn_<title>") 推奨。移行後は tapOn: { id: "deckDelete_Test Deck" } 等に
- extendedWaitUntil:
    notVisible: "Test Deck"
    timeout: 5000
