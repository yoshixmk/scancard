appId: com.plath.scancard
---
# Skill: .kiro/skills/android-cli/references/journeys.md + testing-setup Step 9/12
# Strategy: exact text / clearState / extendedWaitUntil / FilterTypeをコード(Enums.kt:9)に整合: ALL/NEW/LEARNING/REVIEW
# 旧称 LEARNED→LEARNING, REVIEW_NEEDED→REVIEW に修正 (F-5) / NEWは存在するので素直に検証 / testTag提案をコメントで併記
# 参照: StudyScreen:251 FilterMenu "Filter: ${currentFilter.name}", StudyScreen:67 "No cards to study in this filter.", DeckDetailScreen:116 "0 Cards"

- clearState
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ScanCard"
    timeout: 8000

# 1. 事前準備: テスト用Deck作成
- tapOn: "Create Manual Deck"
- extendedWaitUntil:
    visible: "New Deck"
    timeout: 5000
- inputText: "Filter Test Deck"
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Filter Test Deck"
    timeout: 5000

# 2. DeckDetail に入る
- tapOn: "Filter Test Deck"
- extendedWaitUntil:
    visible: "Filter Test Deck"
    timeout: 5000
# 空でも Study に遷移可能であることを確認
- extendedWaitUntil:
    visible: "0 Cards"
    timeout: 5000

# 3. Study 画面へ
- tapOn: "Study"
- extendedWaitUntil:
    visible: "Study"
    timeout: 5000
# 空デッキなら "No cards to study in this filter." が表示される（カード無し状態の検証）
- extendedWaitUntil:
    visible: "No cards to study in this filter."
    timeout: 5000

# 4. Filter 切替: ALL → LEARNING → REVIEW → NEW → ALL (FilterType.entries 準拠: Enums.kt:9)
# FilterMenu は TopAppBar の actions にある "Filter: ALL" ボタン (StudyScreen:251)
# F-5修正: 旧 LEARNED → LEARNING, 旧 REVIEW_NEEDED → REVIEW に置換。NEWはコードに存在するため含める。

# 4-1. ALL (初期値) → LEARNING
- tapOn: "Filter: ALL"
- extendedWaitUntil:
    visible: "ALL"
    timeout: 3000
# TODO(F-3 testTag): text "ALL"/"LEARNING" 等は衝突しやすい → testTag("filterItem_LEARNING") 等に置換推奨 (将来 FilterMenu の DropdownMenuItem に testTag 付与)
- extendedWaitUntil:
    visible: "LEARNING"
    timeout: 3000
- tapOn: "LEARNING"
- extendedWaitUntil:
    visible: "Filter: LEARNING"
    timeout: 5000
# LEARNING フィルタでは空なら同様に empty 表示
- extendedWaitUntil:
    visible: "No cards to study in this filter."
    timeout: 5000

# 4-2. LEARNING → REVIEW
- tapOn: "Filter: LEARNING"
# TODO(F-3 testTag): 将来 testTag("filterButton") + testTag("filterItem_REVIEW") に置換
- extendedWaitUntil:
    visible: "REVIEW"
    timeout: 3000
- tapOn: "REVIEW"
- extendedWaitUntil:
    visible: "Filter: REVIEW"
    timeout: 5000

# 4-3. REVIEW → NEW (FilterType.NEW は存在する — Enums.kt:11)
- tapOn: "Filter: REVIEW"
- extendedWaitUntil:
    visible: "NEW"
    timeout: 3000
- tapOn: "NEW"
- extendedWaitUntil:
    visible: "Filter: NEW"
    timeout: 5000
- extendedWaitUntil:
    visible: "No cards to study in this filter."
    timeout: 3000

# 4-4. NEW → ALL に戻す
- tapOn: "Filter: NEW"
- tapOn: "ALL"
- extendedWaitUntil:
    visible: "Filter: ALL"
    timeout: 5000

# 5. 戻る: Study → DeckDetail → Home
- back
- extendedWaitUntil:
    visible: "Filter Test Deck"
    timeout: 5000
- back
- extendedWaitUntil:
    visible: "ScanCard"
    timeout: 5000

# 6. クリーンアップ
- extendedWaitUntil:
    visible: "Filter Test Deck"
    timeout: 3000
- tapOn:
    id: "Delete"
    # TODO(F-3 testTag): testTag("deckDelete_Filter Test Deck") 推奨
- extendedWaitUntil:
    notVisible: "Filter Test Deck"
    timeout: 5000

# 補足:
# - 将来カードが存在する状態でのフィルタ検証は、scan_to_export_flow.yaml でカードを追加した後に本フローを続けて実行することで可能。
# - DataStore永続化 (IMP-07) 有効化後は、下記を追加して kill→復元を検証:
#   # - runFlow: kill_and_relaunch.yaml  # 別ファイルで app kill → launchApp を再実行
#   # - assertVisible: "Filter: LEARNING"  # 再起動後もフィルタが復元されていること (String exact match, 正規表現や前方一致は使わない)
