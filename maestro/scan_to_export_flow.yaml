appId: com.plath.scancard
---
# Skill: .kiro/skills/android-cli/references/journeys.md + testing-setup Step 9/12
# Strategy: exact text / clearState / extendedWaitUntil + optional で auto-launch / Fake差し替え時の手動介入を optional コメントで整理
# 参照: HomeScreen:42 contentDescription="Scan Document", DeckDetailScreen:88 contentDescription="Add Card", ScanScreen:115 title "Scan Document", DeckDetailScreen:116 "${cards.size} Cards", StudyScreen:67 "No cards to study in this filter.", ExportScreen:35 "Export Deck", FilterType: Enums.kt:9 ALL/NEW/LEARNING/REVIEW

- clearState
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "ScanCard"
    timeout: 8000

# 1. Deck作成（home_flow.yaml と同様）
- tapOn: "Create Manual Deck"
- extendedWaitUntil:
    visible: "New Deck"
    timeout: 5000
- inputText: "E2E Export Deck"
- tapOn: "Create"
- extendedWaitUntil:
    visible: "E2E Export Deck"
    timeout: 5000

# 2. DeckDetail に遷移（デッキカードをタップ）
- tapOn: "E2E Export Deck"
# DeckDetail の TopAppBar タイトルを検証 (deck?.title)
- extendedWaitUntil:
    visible: "E2E Export Deck"
    timeout: 5000
# カード数表示（DeckDetailScreen:116 "${cards.size} Cards (ID: ...)"）— 空デッキ状態 0 Cards
- extendedWaitUntil:
    visible: "0 Cards"
    timeout: 5000

# 3. Scan → Extract（1タップ化対応: F-2 / F-4）
# "Add Card" FAB → "Scan Document" 選択 → ScanScreen自動起動 (alreadyAutoLaunched)
# DeckDetail の FAB は contentDescription="Add Card"
- tapOn:
    id: "Add Card"
    # TODO(F-3 testTag): contentDescription依存 → testTag("deckDetailFabAddCard") 推奨
- extendedWaitUntil:
    visible: "Add Card"
    timeout: 5000
- tapOn: "Scan Document"
# F-2/F-4: 従来 2タップ (Add Card -> Scan Document) を 1タップ+wait に変更。Scan Document 選択後は自動で Scanner 起動
- extendedWaitUntil:
    visible: "Scan Document"
    timeout: 8000
# auto-launch fallback: 権限未付与等で自動起動しなかった場合は手動ボタンが出る → optional
- tapOn:
    text: "Start Scanning"
    optional: true
# GmsDocumentScanner 外部UI → back で閉じる (optional: 実機のみ表示, emulatorやFake時は表示されないため)
- back:
    optional: true
# --- Fake前提の抽出手順 (debugビルドで FakeDocumentScanner/FakeGemmaExtractor 差し替え時に有効化) ---
# 手順: ScanScreenでスキャン完了 → "Extract Cards (n)" → "AI Extraction" 画面 → WorkManager抽出 → DeckDetailに戻る
# 現状は実スキャンUIがオーバーレイするため下記はコメントアウトのまま。Fake導入時は下記ブロックをアンコメントし、maestro test で実行。
# F-4 コメントアウト解除手順:
#   1) debugビルドで Hilt module を Fake に差し替え (FakeDocumentScannerが即座に画像を返す)
#   2) 下記 4行をアンコメント
#   3) エミュレータで `maestro test maestro/scan_to_export_flow.yaml` 実行
# - extendedWaitUntil:
#     visible: "AI Extraction"
#     timeout: 10000
# - tapOn: "Start AI Extraction"
# - extendedWaitUntil:
#     visible: "E2E Export Deck"
#     timeout: 15000
# - extendedWaitUntil:
#     visible: "1 Cards"
#     timeout: 5000
# ---------------------------------------------------------------------------
# 実機では ML Kit DocumentScanner の UI が出るため、上記Fake手順は手動QAで補完する
- back
- extendedWaitUntil:
    visible: "E2E Export Deck"
    timeout: 5000

# 4. Study → Filter 切替 (コードの FilterType に整合: ALL/NEW/LEARNING/REVIEW)
- tapOn: "Study"
- extendedWaitUntil:
    visible: "Study"
    timeout: 5000
# FilterMenu の現在値を確認（デフォルト "Filter: ALL" — StudyScreen:255 "Filter: ${currentFilter.name}"）
- extendedWaitUntil:
    visible: "Filter: ALL"
    timeout: 5000
# フィルタをタップして Dropdown を開く — DropdownMenuItemは FilterType.entries (Enums.kt:9)
- tapOn: "Filter: ALL"
- extendedWaitUntil:
    visible: "ALL"
    timeout: 3000
# TODO(F-3 testTag): textセレクタ "ALL" 等は他画面と衝突しやすい → FilterMenuに testTag("filterDropdownItem_ALL") を付与し id セレクタ化を推奨
- extendedWaitUntil:
    visible: "LEARNING"
    timeout: 3000
- extendedWaitUntil:
    visible: "REVIEW"
    timeout: 3000
- extendedWaitUntil:
    visible: "NEW"
    timeout: 3000
# LEARNING に切替（空なら "No cards to study in this filter." が表示）
- tapOn: "LEARNING"
# フィルタ反映を検証
- extendedWaitUntil:
    visible: "Filter: LEARNING"
    timeout: 5000
# 戻る（Study → DeckDetail）
- back
- extendedWaitUntil:
    visible: "E2E Export Deck"
    timeout: 5000

# 5. Export
- tapOn: "Export"
# ExportScreen タイトルは "Export Deck" (ExportScreen.kt:35)
- extendedWaitUntil:
    visible: "Export Deck"
    timeout: 5000
# 共有シートが出る場合は閉じる
- back
- extendedWaitUntil:
    visible: "E2E Export Deck"
    timeout: 5000

# 6. クリーンアップ: Homeに戻り Deck を削除
- back
- extendedWaitUntil:
    visible: "ScanCard"
    timeout: 5000
- extendedWaitUntil:
    visible: "E2E Export Deck"
    timeout: 3000
- tapOn:
    id: "Delete"
    # TODO(F-3 testTag): testTag("deckDelete_E2E Export Deck") 推奨
- extendedWaitUntil:
    notVisible: "E2E Export Deck"
    timeout: 5000
